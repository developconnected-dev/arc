name = "arc-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Deploy instructions:
# 1. npm install -g wrangler
# 2. wrangler login
# 3. wrangler secret put AVIATIONSTACK_API_KEY
#    (get a free key at https://aviationstack.com — 500 req/month)
# 4. wrangler secret put SUPABASE_URL
# 5. wrangler secret put SUPABASE_ANON_KEY
# 6. wrangler deploy
# 7. Update the URL in Arc > Settings to your worker URL
