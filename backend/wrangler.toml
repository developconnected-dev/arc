name = "arc-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Deploy instructions:
# 1. npm install -g wrangler
# 2. wrangler login
# 3. Create a RapidAPI account, subscribe to AeroDataBox (free "Basic" tier),
#    then:  wrangler secret put RAPIDAPI_KEY
# 4. wrangler secret put SUPABASE_URL       (only needed for Shared Journeys)
# 5. wrangler secret put SUPABASE_ANON_KEY  (only needed for Shared Journeys)
# 6. wrangler deploy
# 7. Put the deployed worker URL in Arc > Settings ("Backend URL")
#
# Endpoints:
#   GET /flight?number=LX1413&date=2026-07-20   flight status (AeroDataBox)
#   GET /inbound?reg=HB-JMB&date=2026-07-20      inbound-aircraft legs (Where's My Plane)
#   GET /position?icao24=4b1815                  live position (OpenSky, free)
#   GET /journey/:code                           shared-journey web page
#   GET /health                                  provider status
