name: Arc
# Signing team for every target. It lives here because xcodegen regenerates
# the project file: set only in Xcode, it is wiped the next time anyone runs
# `xcodegen generate`, and nothing notices until a DEVICE build fails —
# simulator builds do not need a team.
settings:
  base:
    DEVELOPMENT_TEAM: GQZHJ59F4R
    # Version and build live HERE, not per-target, for two reasons. xcodegen
    # rewrites the project file, so a number bumped only in Xcode is silently
    # reset the next time anyone regenerates — which is how an archive went out
    # as build 1 while App Store Connect already held build 30. And an app
    # whose extension carries a different CFBundleVersion fails App Store
    # validation, so the two must not be able to drift apart at all.
    #
    # App Store Connect will not accept a build number it has already seen for
    # a given MARKETING_VERSION: this must go UP for every upload.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 32
options:
  bundleIdPrefix: com.arc
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

targets:
  Arc:
    type: application
    platform: iOS
    sources:
      - path: Arc
        excludes:
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arc.flighttracker
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
    # Explicit Info.plist (xcodegen-generated) instead of INFOPLIST_KEY_*
    # build settings: CFBundleURLTypes (the arc:// invite-link scheme) is a
    # nested structure those settings can't express.
    info:
      path: Arc/Info.plist
      properties:
        CFBundleDisplayName: Arc
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSupportsLiveActivities: true
        # Lets the app talk to a `wrangler dev` worker on http://localhost while
        # testing. Scoped to local networking only — arbitrary cleartext loads
        # to the internet stay blocked.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.arc.flighttracker.refresh]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.arc.flighttracker
            CFBundleURLSchemes: [arc]
    entitlements:
      path: Arc/Arc.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arc.flighttracker
        # Remote-pushed Live Activities (server-side APNs updates). Needs the
        # paid Apple Developer team — with a free/personal team this entitlement
        # can't be provisioned for device builds (simulator builds don't care).
        # Xcode swaps development → production automatically when archiving.
        aps-environment: development
    dependencies:
      - target: ArcWidget
        embed: true

  ArcWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ArcWidget
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arc.flighttracker.widget
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: ArcWidget/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ArcWidget/ArcWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arc.flighttracker

  ArcTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArcTests
    dependencies:
      - target: Arc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arc.flighttracker.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Arc:
    build:
      targets:
        Arc: all
        ArcTests: [test]
    test:
      targets:
        - ArcTests
