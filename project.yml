name: Arc
options:
  bundleIdPrefix: com.arc
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

targets:
  Arc:
    type: application
    platform: iOS
    sources:
      - path: Arc
        excludes:
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arc.flighttracker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Arc
        INFOPLIST_KEY_NSSupportsLiveActivities: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Arc/Arc.entitlements
    dependencies:
      - target: ArcWidget
        embed: true

  ArcWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ArcWidget
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arc.flighttracker.widget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: ArcWidget/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ArcWidget/ArcWidget.entitlements
