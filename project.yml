name: Arc
options:
  bundleIdPrefix: com.arc
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

targets:
  Arc:
    type: application
    platform: iOS
    sources:
      - path: Arc
        excludes:
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arc.flighttracker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Arc
        INFOPLIST_KEY_NSSupportsLiveActivities: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIBackgroundModes: "fetch"
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: "com.arc.flighttracker.refresh"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Arc/Arc.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arc.flighttracker
        # Remote-pushed Live Activities (server-side APNs updates). Needs the
        # paid Apple Developer team — with a free/personal team this entitlement
        # can't be provisioned for device builds (simulator builds don't care).
        # Xcode swaps development → production automatically when archiving.
        aps-environment: development
    dependencies:
      - target: ArcWidget
        embed: true

  ArcWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ArcWidget
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arc.flighttracker.widget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: ArcWidget/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ArcWidget/ArcWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.arc.flighttracker

  ArcTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArcTests
    dependencies:
      - target: Arc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arc.flighttracker.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Arc:
    build:
      targets:
        Arc: all
        ArcTests: [test]
    test:
      targets:
        - ArcTests
